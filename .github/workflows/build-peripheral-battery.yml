name: Build peripheral battery plugin

on:
  push:
    branches: [feature/peripheral-battery-plugin]
    paths:
      - 'PeripheralBatteryPlugin/**'
      - '.github/workflows/build-peripheral-battery.yml'
  pull_request:
    paths:
      - 'PeripheralBatteryPlugin/**'
      - '.github/workflows/build-peripheral-battery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: msbuild PeripheralBatteryPlugin/PeripheralBatteryPlugin.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: PeripheralBatteryPlugin-x64
          path: PeripheralBatteryPlugin/bin/x64/Release/PeripheralBatteryPlugin.dll
          if-no-files-found: error
          retention-days: 14
