; PeripheralBatteryPlugin - settings
; Changes take effect with the next poll cycle; restarting TrafficMonitor is not necessary.
; The options dialog (TrafficMonitor: Plugin manager -> Peripheral Battery -> Options) edits this file as well.
; Labels (M4, Mouse): with Colors=1 set them below under Label=, with Colors=0 in TrafficMonitor under "Display settings".

[General]
; Poll interval in seconds (15 to 3600)
UpdateInterval=60
; 1 = show "—" when the device is not connected; 0 = leave empty
ShowDisconnected=1
; 1 = "82%", 0 = "82"
ShowPercentSign=1
; 1 = "⚡" while charging (only if the device reports its charge state). With 0, mice that only report
;     their voltage (e.g. G502) show "?" while charging – there is no percentage under charging current
ShowCharging=1
; TrafficMonitor notification when a battery drops to this level (percent) or below; 0 = off
LowBatteryWarning=15
; 1 = value red at LowBatteryWarning or below, green while charging. The plugin then draws the item itself
;     and takes the label from Label=. 0 = TrafficMonitor draws, label from its own settings
Colors=1
; 1 = write every poll cycle to PeripheralBatteryPlugin.log; 0 = only start, errors and state changes
VerboseLogging=0

[Headphones]
Enabled=1
; WindowsBluetooth or LogitechHidpp
Provider=WindowsBluetooth
; Part of the device name, case-insensitive
NameContains=
; Label in front of the value (only with Colors=1)
Label=Headphones

[Mouse]
Enabled=1
Provider=LogitechHidpp
; empty = first Logitech device with a battery
NameContains=
Label=Mouse
[Keyboard]
; Tries Windows Bluetooth battery properties and Logitech HID++.
Enabled=1
Provider=KeyboardAuto
NameContains=keyboard
Label=Keyboard
